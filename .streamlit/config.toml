[server]
# Sur Linux (Streamlit Cloud) : "poll" est plus fiable que "none"
# En local : passer à "none" si les rechargements automatiques gênent
runOnSave = false
fileWatcherType = "poll"

[browser]
# Désactive la collecte de statistiques d'usage
gatherUsageStats = false

[theme]
primaryColor = "#1B3A6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#1A1A2E"
